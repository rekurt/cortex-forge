services:

  # ════════════════════════════════════════════════════
  # CLIProxyAPI — OAuth-прокси для Claude Max
  # Позволяет использовать подписку Claude Max вместо API-ключа.
  # quota-proxy форвардит запросы сюда вместо api.anthropic.com.
  # ════════════════════════════════════════════════════
  cliproxyapi:
    image: eceasy/cli-proxy-api:latest
    container_name: corp-cliproxyapi
    restart: unless-stopped
    volumes:
      - ./cliproxyapi/config.yaml:/CLIProxyAPI/config.template.yaml:ro
      - ./cliproxyapi/entrypoint.sh:/entrypoint.sh:ro
      - cliproxyapi-auths:/root/.cli-proxy-api
      - cliproxyapi-logs:/CLIProxyAPI/logs
    environment:
      - CLIPROXY_API_KEY=${CLIPROXY_API_KEY}
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    networks:
      - corp-egress
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q --header='x-api-key: '\"$CLIPROXY_API_KEY\" http://localhost:8317/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ════════════════════════════════════════════════════
  # CortexForge Proxy — единственное место с реальным API-ключом
  # Hardened: нет проброса портов наружу, resource limits
  # ════════════════════════════════════════════════════
  quota-proxy:
    build: ./quota-proxy
    container_name: corp-quota
    restart: unless-stopped
    env_file: .env
    environment:
      - QUOTA_DB=/data/quota.db
      - QUOTA_PORT=9090
      - UPSTREAM_URL=http://cliproxyapi:8317
      - UPSTREAM_API_KEY=${CLIPROXY_API_KEY}
    volumes:
      - quota-data:/data
    ports:
      - "127.0.0.1:9090:9090"   # quota dashboard — только localhost
    # corp-egress нужен для форвардинга запросов в api.anthropic.com
    networks:
      - corp-internal
      - corp-admin
      - corp-egress
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:9090/quota/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      cliproxyapi:
        condition: service_healthy

  # ════════════════════════════════════════════════════
  # MESSAGE BROKER — шина сообщений (только corp-internal)
  # ════════════════════════════════════════════════════
  message-broker:
    build: ./broker
    container_name: corp-broker
    restart: unless-stopped
    env_file: .env
    environment:
      - BROKER_PORT=8080
      - BROKER_DB=/data/broker.db
    volumes:
      - broker-data:/data
    networks:
      - corp-internal
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s

  # ════════════════════════════════════════════════════
  # ADMIN — управляет инфрой, весь проект в /infra/ (rw)
  # ANTHROPIC_API_KEY передаётся через environment
  # Подключён к corp-admin (для quota API) + corp-internal (для broker)
  # ════════════════════════════════════════════════════
  assistant-admin:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: corp-admin
    restart: unless-stopped
    env_file: instances/admin/.env
    volumes:
      - ./instances/admin/openclaw_data:/home/node/.openclaw
      - ./instances/admin/openclaw_data/ssh:/home/node/.ssh
      - ./shared/skills:/shared/skills
      - ./shared/docs:/shared/docs
      - ./shared/compliance-data:/shared/compliance-data
      - ./instances/admin/workspace:/home/node/.openclaw/workspace
      - ./instances/admin/openclaw.json:/home/node/.openclaw/openclaw.json
      # Весь проект (rw) — admin уже имеет ANTHROPIC_API_KEY через environment
      - ./:/infra/
      - ../:/infra-parent/    # доступ к внешним данным
      - /var/run/docker.sock:/var/run/docker.sock:ro  # статус контейнеров (read-only)
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}   # admin ходит напрямую
      - BROKER_URL=http://message-broker:8080
      - BROKER_KEY=${BROKER_KEY_ADMIN}
      - QUOTA_PROXY_URL=http://quota-proxy:9090
      - QUOTA_ADMIN_TOKEN=${QUOTA_ADMIN_TOKEN}
      - WORKSPACE_PARENT=/infra-parent           # для sync-instances.sh и migrate-instances.py
      - SERVICE_API_KEY=${SERVICE_API_KEY}
      - NODE_OPTIONS=--max-old-space-size=1536
    ports:
      - "127.0.0.1:18789:18789"   # OpenClaw Control UI — http://localhost:18789
    networks:
      - corp-internal
      - corp-admin
      - corp-outbound
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    depends_on:
      quota-proxy:
        condition: service_healthy
      message-broker:
        condition: service_healthy

  # ════════════════════════════════════════════════════
  # ПЕРСОНАЛЬНЫЕ ИНСТАНСЫ → docker-compose.override.yml (gitignored)
  # Добавляются через: make add-user NAME=x BOT_TOKEN=y TG_ID=z
  # Удаляются через: make remove-user NAME=x
  # Изолированы: нет /infra, нет corp-admin сети
  # ════════════════════════════════════════════════════

  # ════════════════════════════════════════════════════
  # RESOURCE MONITOR — метрики контейнеров, диска, квот
  # Алерты → broker, HTTP API → corp-admin (порт 9091)
  # ════════════════════════════════════════════════════
  resource-monitor:
    build: ./resource-monitor
    container_name: corp-monitor
    restart: unless-stopped
    env_file: .env
    environment:
      - MONITOR_DB=/data/metrics.db
      - MONITOR_PORT=9091
      - MONITOR_INTERVAL=60
    volumes:
      - monitor-data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:9091:9091"   # monitor dashboard — только localhost
    networks:
      - corp-internal
      - corp-admin
    security_opt:
      - no-new-privileges:true
    group_add:
      - "${DOCKER_GID:-999}"   # docker group GID — нужен для доступа к /var/run/docker.sock под non-root
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    depends_on:
      quota-proxy:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:9091/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ════════════════════════════════════════════════════
  # SERVICE AGENT — HTTP API для внутренних сервисов
  # Реплицируемый: make add-service NAME=svc-compliance
  # Скиллы: compliance (+ другие по мере добавления)
  # ════════════════════════════════════════════════════
  assistant-service:
    build: ./service-agent
    container_name: corp-service
    restart: unless-stopped
    env_file: .env
    environment:
      - SERVICE_PORT=8090
      - SERVICE_API_KEY=${SERVICE_API_KEY}
      - SKILL_TIMEOUT=150
      - MAX_CONCURRENT_TASKS=5
      - DADATA_API_KEY=${DADATA_API_KEY:-}
      - DADATA_SECRET=${DADATA_SECRET:-}
      - BROKER_URL=http://message-broker:8080
      - BROKER_KEY=${BROKER_KEY_SERVICE}
      - QUOTA_ADMIN_TOKEN=${QUOTA_ADMIN_TOKEN}
      - QUOTA_PROXY_URL=http://quota-proxy:9090
      - MONITOR_URL=http://resource-monitor:9091
      - MONITOR_ADMIN_TOKEN=${MONITOR_ADMIN_TOKEN:-}
    volumes:
      - service-data:/data
      - ./service-agent/skills:/app/skills:ro
      - ./shared/skills:/shared/skills:ro
      - ./shared/docs:/shared/docs:ro
    ports:
      - "127.0.0.1:8090:8090"   # только localhost — nginx/reverse-proxy закроет снаружи
    networks:
      - corp-internal
      - corp-services
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8090/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  quota-data:
    driver: local
  broker-data:
    driver: local
  monitor-data:
    driver: local
  service-data:
    driver: local
  cliproxyapi-auths:
    driver: local
  cliproxyapi-logs:
    driver: local

networks:
  # Все инстансы + broker + quota-proxy + monitor + service
  corp-internal:
    driver: bridge
    internal: true   # нет доступа к интернету напрямую (через quota-proxy)

  # Только admin + quota-proxy + monitor (для управления квотами и метриками)
  corp-admin:
    driver: bridge
    internal: true

  # Для service-agent — backend-сервисы ходят через эту сеть
  corp-services:
    driver: bridge
    # НЕ internal: true — backend сервисы могут ходить через docker network

  # Egress-only сеть для quota-proxy: только этот контейнер имеет выход в интернет.
  # Все остальные сети — internal: true, что гарантирует что инстансы не ходят
  # напрямую в api.anthropic.com — только через quota-proxy.
  corp-egress:
    driver: bridge
    # Нет internal: true — quota-proxy форвардит запросы в api.anthropic.com

  # Сеть для внешних API инстансов (Telegram, etc.)
  # Anthropic-запросы всё равно идут через quota-proxy (QUOTA_KEY не работает напрямую)
  corp-outbound:
    driver: bridge
    # Нет internal: true — инстансы могут ходить в Telegram API и др.
