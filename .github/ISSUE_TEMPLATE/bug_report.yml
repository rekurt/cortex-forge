name: 🐛 Bug Report
description: Something isn't working as expected
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
        Please fill in as much detail as possible.

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `cat VERSION` in the repo root
      placeholder: "0.1.3"
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of corp-assistant is affected?
      options:
        - quota-proxy
        - message-broker
        - resource-monitor
        - service-agent
        - admin instance (Admin)
        - user instance
        - scripts (add-user / remove-user)
        - CI / GitHub Actions
        - documentation
        - other
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS / Environment
      placeholder: "Ubuntu 24.04, Docker 27.x, Docker Compose 2.x"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the issue
      placeholder: |
        1. Run `make add-user NAME=test BOT_TOKEN=...`
        2. Run `make deploy`
        3. Send a message to the bot
        4. See error in logs: `make logs NAME=test`
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      placeholder: "The bot should reply with a greeting."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
      placeholder: "The container exits with code 1."
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Run `make logs NAME=<instance>` or `docker compose logs <service>`
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and didn't find a duplicate
          required: true
        - label: I am using the latest version
          required: false
        - label: I have removed any secrets from logs/config before posting
          required: true
