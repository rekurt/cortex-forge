# Дополнительные паттерны секретов для Trivy
rules:
  - id: quota-key-exposed
    category: Quota
    title: Capuchin Quota Key
    severity: CRITICAL
    regex: "quota-[a-z]+-[A-Za-z0-9_-]{20,}"
    keywords:
      - quota-

  - id: broker-key-exposed
    category: Broker
    title: Capuchin Broker Key
    severity: HIGH
    regex: "BROKER_KEY_[A-Z]+=[A-Za-z0-9_-]{20,}"
    keywords:
      - BROKER_KEY_

  - id: mcp-admin-token
    category: MCP
    title: MCP Admin Token
    severity: CRITICAL
    regex: "MCP_ADMIN_TOKEN=[A-Za-z0-9_-]{20,}"
    keywords:
      - MCP_ADMIN_TOKEN
